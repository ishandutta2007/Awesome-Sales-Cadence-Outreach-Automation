<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0a0d18;border-radius:14px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1024" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080b14" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic Ambient Animated Waves / Light Beams (Background Layer) -->
  <g opacity="0.4">
    <circle cx="950" cy="90" r="140" fill="#6366f1" filter="url(#glow)" opacity="0.25">
      <animate attributeName="r" values="130;160;130" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.35;0.2" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="150" cy="280" r="120" fill="#ec4899" filter="url(#glow)" opacity="0.2">
      <animate attributeName="r" values="110;140;110" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.15;0.3;0.15" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="180" r="180" fill="#06b6d4" filter="url(#glow)" opacity="0.12">
      <animate attributeName="cx" values="580;620;580" dur="12s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Dynamic Moving Flow Lines (Outreach Cadence Sequences) Behind Cards -->
  <g stroke="url(#primaryGrad)" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 700 80 C 820 50, 920 120, 1080 90">
      <animate attributeName="stroke-dasharray" values="6,12;12,6;6,12" dur="6s" repeatCount="indefinite" />
    </path>
    <path d="M 720 180 C 850 150, 930 220, 1120 180">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="7s" repeatCount="indefinite" />
    </path>
    <path d="M 700 280 C 830 310, 940 250, 1100 270">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="8s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Right Decorative Live Sequence Flow Elements -->
  <g transform="translate(740, 50)">
    <!-- Node 1: Step 1 Email -->
    <g transform="translate(0, 20)">
      <rect width="170" height="52" rx="10" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="25" cy="26" r="10" fill="#6366f1" opacity="0.3" />
      <text x="25" y="30" text-anchor="middle" fill="#818cf8" font-size="12" font-weight="bold">1</text>
      <text x="45" y="24" fill="#f8fafc" font-size="12" font-weight="bold">Cold Email</text>
      <text x="45" y="40" fill="#94a3b8" font-size="10">Personalized Angle</text>
    </g>

    <!-- Flow Connector 1 to 2 -->
    <path d="M 85 72 L 85 96" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" values="16;0" dur="2s" repeatCount="indefinite" />
    </path>

    <!-- Node 2: Deliverability / Warmup -->
    <g transform="translate(0, 98)">
      <rect width="170" height="52" rx="10" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.5" />
      <circle cx="25" cy="26" r="10" fill="#06b6d4" opacity="0.3" />
      <text x="25" y="30" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">2</text>
      <text x="45" y="24" fill="#f8fafc" font-size="12" font-weight="bold">Smart Warmup</text>
      <text x="45" y="40" fill="#94a3b8" font-size="10">Inbox Rotation</text>
    </g>

    <!-- Flow Connector 2 to 3 -->
    <path d="M 85 150 L 85 174" stroke="#ec4899" stroke-width="2" stroke-dasharray="4,4">
      <animate attributeName="stroke-dashoffset" values="16;0" dur="2s" repeatCount="indefinite" />
    </path>

    <!-- Node 3: Multi-step Touchpoint -->
    <g transform="translate(0, 176)">
      <rect width="170" height="52" rx="10" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.5" />
      <circle cx="25" cy="26" r="10" fill="#ec4899" opacity="0.3" />
      <text x="25" y="30" text-anchor="middle" fill="#f472b6" font-size="12" font-weight="bold">3</text>
      <text x="45" y="24" fill="#f8fafc" font-size="12" font-weight="bold">Follow-Up Step</text>
      <text x="45" y="40" fill="#94a3b8" font-size="10">Auto Stop on Reply</text>
    </g>

    <!-- Pipeline Metrics Mini-Card -->
    <g transform="translate(200, 50)">
      <rect width="190" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <text x="20" y="30" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">ENGAGEMENT ENGINE</text>
      <text x="20" y="60" fill="#38bdf8" font-size="24" font-weight="bold">68.4%</text>
      <text x="20" y="76" fill="#64748b" font-size="10">Avg Open & Placement</text>
      
      <line x1="20" y1="92" x2="170" y2="92" stroke="#334155" stroke-width="1" />

      <text x="20" y="118" fill="#10b981" font-size="20" font-weight="bold">24.2%</text>
      <text x="20" y="134" fill="#64748b" font-size="10">Target Reply Conversion</text>

      <!-- Pulsing Active Indicator -->
      <circle cx="165" cy="26" r="4" fill="#10b981">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>

  <!-- Foreground Main Title and Subtitle Area -->
  <g transform="translate(70, 70)">
    <!-- Category Badge -->
    <rect width="265" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#6366f1">
      <animate attributeName="fill" values="#6366f1;#ec4899;#6366f1" dur="4s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="18" fill="#c7d2fe" font-size="11" font-weight="600" letter-spacing="1.2">SALES CADENCE &amp; OUTREACH</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#ffffff" font-size="38" font-weight="900" letter-spacing="-0.8">
      Awesome Sales Cadence
    </text>
    <text x="0" y="125" fill="url(#primaryGrad)" font-size="36" font-weight="900" letter-spacing="-0.6">
      &amp; Outreach Automation
    </text>

    <!-- Subtitle / Value Prop -->
    <text x="0" y="172" fill="#94a3b8" font-size="14.5" font-weight="400">
      Curated directory of top B2B sales sequencers, deliverability stacks,
    </text>
    <text x="0" y="196" fill="#94a3b8" font-size="14.5" font-weight="400">
      multi-step cold outbound tools, and self-hosted AI outreach engines.
    </text>

    <!-- Highlights Pills -->
    <g transform="translate(0, 222)">
      <rect width="115" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="57" y="18" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="500">Multi-Channel</text>

      <g transform="translate(125, 0)">
        <rect width="130" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
        <text x="65" y="18" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="500">Inbox Warmup</text>
      </g>

      <g transform="translate(265, 0)">
        <rect width="145" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
        <text x="72" y="18" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="500">Open-Source Engines</text>
      </g>
    </g>
  </g>
</svg>
